<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0A192F" />
    <title>مكتب علي شوفرليت</title>
    <style>
      html, body { margin: 0; padding: 0; min-height: 100dvh; background: #0A192F; color: #fff; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      #boot-splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(ellipse at top, #0f172a 0%, #0A192F 55%, #020617 100%); z-index: 9999; transition: opacity .3s ease; }
      #boot-splash img { width: 128px; height: 128px; border-radius: 28px; box-shadow: 0 0 60px rgba(201,162,39,.35); border: 2px solid rgba(201,162,39,.4); background: #0f172a; object-fit: contain; padding: 10px; }
      #boot-splash .title { margin-top: 22px; font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
      #boot-splash .tag { margin-top: 8px; font-size: 13px; color: #C9A227; }
      #boot-splash .bar { margin-top: 28px; width: 180px; height: 3px; border-radius: 999px; background: rgba(255,255,255,.1); overflow: hidden; }
      #boot-splash .bar::after { content: ""; display: block; height: 100%; width: 33%; background: linear-gradient(90deg, transparent, #C9A227, transparent); animation: bootbar 1.4s ease-in-out infinite; }
      @keyframes bootbar { 0% { transform: translateX(-100%);} 100% { transform: translateX(320%);} }
    </style>
  </head>
  <body>
    <div id="boot-splash">
      <img src="/icon-512.png" alt="مكتب علي شوفرليت" />
      <div class="title">مكتب علي شوفرليت</div>
      <div class="tag">قطع أصلية · العراق</div>
      <div class="bar"></div>
    </div>
    <script>
      (function () {
        var el = document.getElementById('boot-splash');
        var hidden = false;
        function hide() {
          if (hidden || !el) return;
          hidden = true;
          el.style.opacity = '0';
          setTimeout(function () { el && el.remove(); }, 350);
        }
        // React calls this once it has painted its first UI so the loading
        // layer stays on screen until the app is actually ready.
        window.hideBootSplash = hide;
        // Safety fallback: never block the app longer than 8 seconds.
        setTimeout(hide, 8000);
      })();
    </script>
  </body>
</html>
